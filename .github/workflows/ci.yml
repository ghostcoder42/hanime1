# CI quality gate — runs on every push/PR to main.
# Uses the project's own `bun run check-all` (lint + type-check + test).
name: CI
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  quality:
    name: Lint · Typecheck · Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint (Biome)
        run: bun run lint

      - name: Type-check
        run: bun run type-check

      - name: Test (Jest)
        run: bun run test -- --coverage --ci
